<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f7cff">
  <meta name="description" content="算术练习：整数小数加减乘除、混合运算，六级难度，错题本与统计">
  <title>算术练习</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f7cff'/><text x='50' y='70' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>算</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- 首页：难度选择 -->
    <section id="view-home" class="view active">
      <header class="home-header">
        <h1>算术练习</h1>
        <p class="subtitle">每天练一练，口算顶呱呱</p>
      </header>
      <div class="level-list" id="level-list"></div>
      <div class="home-actions">
        <button class="btn btn-outline" id="btn-wrong">错题本 <span class="badge" id="wrong-count">0</span></button>
        <button class="btn btn-outline" id="btn-stats">练习统计</button>
      </div>
      <footer class="home-tip">数据保存在本机浏览器中，无需联网</footer>
    </section>

    <!-- 练习页 -->
    <section id="view-practice" class="view">
      <div class="practice-header">
        <button class="icon-btn" id="btn-back" aria-label="返回首页">←</button>
        <span class="practice-title" id="practice-title"></span>
        <span class="streak" id="streak">连对 0</span>
      </div>
      <div class="session-bar" id="session-bar">本次已答 0 题 · 答对 0 · 正确率 0%</div>
      <div class="dots" id="dots"></div>
      <div class="q-card">
        <div class="q-progress" id="q-progress">第 1 题</div>
        <div class="q-expression" id="q-expression"></div>
        <div class="q-input" id="q-input"><span class="q-input-text" id="q-input-text"></span><span class="caret"></span></div>
        <div class="q-feedback" id="q-feedback"></div>
      </div>
      <div class="keypad" id="keypad">
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key func" data-key="back" aria-label="退格">⌫</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key func" data-key="clear" aria-label="清空">C</button>
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key func" data-key="dot">.</button>
        <button class="key" data-key="0">0</button>
        <button class="key confirm" data-key="confirm">确认</button>
      </div>
      <button class="btn btn-primary btn-next hidden" id="btn-next">下一题</button>
    </section>

    <!-- 错题本 -->
    <section id="view-wrong" class="view">
      <div class="page-header">
        <button class="icon-btn" id="btn-wrong-back" aria-label="返回首页">←</button>
        <span class="practice-title">错题本</span>
        <span class="streak count-badge" id="wrong-total">0</span>
      </div>
      <div class="wrong-list" id="wrong-list"></div>
      <div class="wrong-actions">
        <button class="btn btn-primary" id="btn-wrong-start">开始重练</button>
        <button class="btn btn-danger" id="btn-wrong-clear">清空</button>
      </div>
    </section>

    <!-- 练习统计 -->
    <section id="view-stats" class="view">
      <div class="page-header">
        <button class="icon-btn" id="btn-stats-back" aria-label="返回首页">←</button>
        <span class="practice-title">练习统计</span>
      </div>
      <div class="stats-overview">
        <div class="st-card"><b id="st-attempted">0</b><span>总答题</span></div>
        <div class="st-card"><b id="st-correct">0</b><span>答对</span></div>
        <div class="st-card"><b id="st-acc">0%</b><span>正确率</span></div>
      </div>
      <div id="stats-levels"></div>
      <button class="btn btn-danger btn-block" id="btn-stats-clear">清空统计数据</button>
    </section>

  </div>
  <script src="js/generator.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
